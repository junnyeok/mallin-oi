<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>말린오이닷컴</title>

    <!-- 공통 css -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
    <link
      rel="stylesheet"
      href="./assets/css/components/character-effects.css"
    />

    <!-- main -->
    <link rel="stylesheet" href="./assets/css/main/main.css" />
    <link rel="stylesheet" href="./assets/css/main/store-main.css" />
  </head>

  <body data-page="home">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section class="home-section" id="featuredStoreSection">
          <div class="container">
            <div class="home-section__head">
              <h2 class="home-section__title">New 상품 품목</h2>
              <a
                class="home-section__more home-section__more--cta"
                href="./store.html"
                >더보기</a
              >
            </div>

            <div class="store-showcase" aria-label="New 상품 품목 슬라이더">
              <button
                type="button"
                class="store-showcase__nav store-showcase__nav--prev"
                id="storePrevBtn"
                aria-label="이전 품목 보기"
              >
                ‹
              </button>

              <div class="store-showcase__viewport" id="storeFeaturedViewport">
                <div class="store-showcase__track" id="storeFeaturedGrid"></div>
              </div>

              <button
                type="button"
                class="store-showcase__nav store-showcase__nav--next"
                id="storeNextBtn"
                aria-label="다음 품목 보기"
              >
                ›
              </button>
            </div>

            <div class="store-showcase__footer">
              <p
                class="store-showcase__status"
                id="storeFeaturedStatus"
                aria-live="polite"
              ></p>
            </div>
          </div>
        </section>

        <section class="home-section">
          <div class="container">
            <div class="panel panel--latest-wide" id="latestUploadSection">
              <div class="panel__head panel__head--with-more">
                <h2 class="panel__title">🆕 최신 업로드</h2>
                <a
                  class="home-section__more home-section__more--cta home-section__more--panel"
                  href="./posts-all.html"
                  >더보기</a
                >
              </div>
              <div class="mini" id="latestList"></div>
            </div>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
