<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이페이지 | 말린오이닷컴</title>

    <!-- 공통 css -->
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />

    <!-- page -->
    <link rel="stylesheet" href="./assets/css/pages/index.css" />

    <!-- mypage 전용 -->
    <link rel="stylesheet" href="./assets/css/main/mypage-main.css" />
  </head>

  <body data-page="mypage">
    <div class="page">
      <div data-include="header"></div>

      <main class="mypage-main">
        <div class="mypage-card">
          <div class="mypage-title-row">
            <h1 class="mypage-title">마이페이지</h1>
            <span
              id="mypageRoleBadge"
              class="mypage-role-badge is-member"
              aria-label="회원 등급"
            >
              일반회원
            </span>
          </div>

          <p class="mypage-desc">회원정보를 확인하고 수정할 수 있어.</p>

          <section class="mypage-summary" aria-label="회원 요약 정보">
            <div class="mypage-summary-item">
              <span class="mypage-summary-label">가입일</span>
              <strong class="mypage-summary-value" id="mypageCreatedAt"
                >-</strong
              >
            </div>

            <div class="mypage-summary-item">
              <span class="mypage-summary-label">작성글 수</span>
              <strong class="mypage-summary-value" id="mypagePostCount"
                >0</strong
              >
            </div>
          </section>

          <form id="mypageForm" class="mypage-form" autocomplete="on">
            <section class="mypage-section">
              <h2 class="mypage-section-title">계정 정보</h2>

              <div class="mypage-field">
                <label for="mypageEmail">이메일</label>
                <input
                  type="email"
                  id="mypageEmail"
                  name="mypageEmail"
                  placeholder="example@email.com"
                  autocomplete="email"
                  readonly
                />
                <p class="help-text">이메일은 현재 변경할 수 없어.</p>
              </div>

              <div class="mypage-field">
                <label for="mypageNickname">닉네임</label>
                <input
                  type="text"
                  id="mypageNickname"
                  name="mypageNickname"
                  placeholder="최소 2글자 이상"
                  autocomplete="nickname"
                />
              </div>
            </section>

            <section class="mypage-section">
              <h2 class="mypage-section-title">비밀번호 변경</h2>

              <div class="mypage-field">
                <label for="mypageCurrentPw">현재 비밀번호</label>
                <input
                  type="password"
                  id="mypageCurrentPw"
                  name="mypageCurrentPw"
                  placeholder="현재 비밀번호 입력"
                  autocomplete="current-password"
                />
              </div>

              <div class="mypage-field">
                <label for="mypageNewPw">새 비밀번호</label>
                <input
                  type="password"
                  id="mypageNewPw"
                  name="mypageNewPw"
                  minlength="6"
                  maxlength="32"
                  placeholder="6자 이상"
                  autocomplete="new-password"
                />
                <p class="help-text">
                  비밀번호를 바꾸지 않을 거면 비워둬도 돼.
                </p>
              </div>

              <div class="mypage-field">
                <label for="mypageNewPw2">새 비밀번호 확인</label>
                <input
                  type="password"
                  id="mypageNewPw2"
                  name="mypageNewPw2"
                  minlength="6"
                  maxlength="32"
                  placeholder="새 비밀번호 다시 입력"
                  autocomplete="new-password"
                />
              </div>
            </section>

            <button type="submit" class="mypage-btn">회원정보 저장</button>

            <p class="mypage-msg" id="mypageMsg"></p>
          </form>

          <section class="mypage-section" aria-label="내가 쓴 글">
            <h2 class="mypage-section-title">내가 쓴 글</h2>
            <div id="mypagePostList" class="mypage-list"></div>

            <div class="mypage-pager" aria-label="내가 쓴 글 페이지네이션">
              <button
                type="button"
                class="mypage-sub-btn"
                id="mypagePostPrevBtn"
              >
                이전
              </button>
              <span class="mypage-pager__info" id="mypagePostPageInfo"
                >1 / 1</span
              >
              <button
                type="button"
                class="mypage-sub-btn"
                id="mypagePostNextBtn"
              >
                다음
              </button>
            </div>
          </section>

          <section class="mypage-section" aria-label="내가 쓴 댓글">
            <h2 class="mypage-section-title">내가 쓴 댓글</h2>
            <div id="mypageCommentList" class="mypage-list"></div>

            <div class="mypage-pager" aria-label="내가 쓴 댓글 페이지네이션">
              <button
                type="button"
                class="mypage-sub-btn"
                id="mypageCommentPrevBtn"
              >
                이전
              </button>
              <span class="mypage-pager__info" id="mypageCommentPageInfo"
                >1 / 1</span
              >
              <button
                type="button"
                class="mypage-sub-btn"
                id="mypageCommentNextBtn"
              >
                다음
              </button>
            </div>
          </section>

          <section class="mypage-section mypage-section--account">
            <h2 class="mypage-section-title">계정 관리</h2>

            <div class="mypage-action-row">
              <button type="button" class="mypage-sub-btn" id="mypageLogoutBtn">
                로그아웃
              </button>
            </div>
          </section>

          <section class="mypage-section mypage-section--danger">
            <h2 class="mypage-section-title">회원탈퇴</h2>
            <p class="mypage-danger-text">
              회원탈퇴 기능은 아직 준비 중이야. 나중에 안전하게 백엔드까지
              붙여서 지원할 예정이야.
            </p>

            <div class="mypage-action-row">
              <button
                type="button"
                class="mypage-danger-btn"
                id="mypageWithdrawBtn"
              >
                회원탈퇴
              </button>
            </div>

            <p class="mypage-withdraw-msg" id="mypageWithdrawMsg"></p>
          </section>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/main.js?v=20260313-0105"></script>
  </body>
</html>
