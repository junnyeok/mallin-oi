<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>말린오이닷컴</title>
    <!-- 공통 -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <link rel="stylesheet" href="assets/css/00-reset.css" />
    <link rel="stylesheet" href="assets/css/01-tokens.css" />
    <link rel="stylesheet" href="assets/css/02-base.css" />
    <link rel="stylesheet" href="assets/css/03-layout.css" />
    <link rel="stylesheet" href="assets/css/components/forms.css" />
    <link rel="stylesheet" href="assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="assets/css/components/nav.css" />
    <link rel="stylesheet" href="assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />

    <!-- main -->
    <link rel="stylesheet" href="assets/css/main/main.css" />
  </head>
  <body class="theme-career" data-page="career">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section class="home-section">
          <div class="container">
            <section class="panel" aria-labelledby="careerIntroTitle">
              <div class="panel__head">
                <h1 class="panel__title" id="careerIntroTitle">
                  ✨ 자신의 이력을 뽐내세요!
                </h1>
                <p class="panel__desc">
                  사소한 것이든 거창한 것이든 상관없습니다!
                </p>
              </div>
            </section>
          </div>
        </section>

        <section class="home-section">
          <div class="container">
            <section
              class="panel career-best-panel"
              aria-labelledby="careerBestTitle"
            >
              <div class="panel__head">
                <h2 class="panel__title" id="careerBestTitle">
                  🏆 이번 달 베스트 이력
                </h2>
                <p class="panel__desc">
                  조회수와 좋아요, 참신해요, 댓글을 모아 이번 달의 이력을
                  소개해.
                </p>
              </div>
              <div
                class="career-best"
                id="careerBestList"
                aria-live="polite"
                aria-busy="true"
              >
                <p class="panel__desc career-best__state">
                  이번 달 베스트 이력을 불러오는 중이야.
                </p>
              </div>
            </section>
          </div>
        </section>

        <section class="home-section">
          <div class="container">
            <section
              class="panel panel--latest-wide"
              aria-labelledby="careerLatestTitle"
            >
              <div class="panel__head panel__head--with-more">
                <h2 class="panel__title" id="careerLatestTitle">
                  🆕 최신 이력
                </h2>
                <a
                  class="home-section__more home-section__more--cta home-section__more--panel"
                  href="./posts-all.html?tab=career"
                  >더보기</a
                >
              </div>
              <div class="mini" id="latestList" aria-live="polite">
                <p class="panel__desc">이력 게시물을 불러오는 중이야.</p>
              </div>
            </section>
          </div>
        </section>
      </main>
      <div data-include="footer"></div>
    </div>
    <img
      id="cukeBuddy"
      src="images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />
    <script type="module" src="./assets/js/boot.js"></script>
    <!-- type에 module을 쓰면 import, export가 가능,
    내부적으로 다 읽고 나서 실행하라는 의미도 돼서 DOMContentLoaded와 타이밍 맞음,
    파일 스코프가 분리됨-> 모듈 안에서 선언한 변수는 전역 오염이 안됨. -->
  </body>
</html>
