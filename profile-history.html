<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내역페이지 | 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />

    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
    <link rel="stylesheet" href="./assets/css/main/profile-history-main.css" />
  </head>
  <body data-page="profile-history">
    <div class="page">
      <div data-include="header"></div>

      <main class="history-main">
        <div class="history-card">
          <section class="history-hero">
            <p class="history-hero__eyebrow">내프로필</p>
            <div class="history-hero__top">
              <div>
                <h1 class="history-hero__title">내역페이지</h1>
                <p class="history-hero__desc">
                  날짜를 검색해서 피클 내역, 내가 쓴 글, 내가 쓴 댓글/답글을
                  확인할 수 있어.
                </p>
              </div>
            </div>
          </section>

          <section class="history-search">
            <div class="history-search__row">
              <div class="history-search__field">
                <label for="historyDate">날짜 검색</label>
                <input type="date" id="historyDate" />
              </div>

              <div class="history-search__actions">
                <button
                  type="button"
                  class="history-btn history-btn--primary"
                  id="historySearchBtn"
                >
                  검색
                </button>
                <button type="button" class="history-btn" id="historyResetBtn">
                  초기화
                </button>
              </div>
            </div>

            <p class="history-search__result" id="historySearchResult">
              전체 내역을 보여주고 있어.
            </p>
          </section>

          <section class="history-tabs" aria-label="내역 구분">
            <button
              type="button"
              class="history-tab is-active"
              data-history-tab="all"
            >
              전체
            </button>
            <button type="button" class="history-tab" data-history-tab="pickle">
              피클 내역
            </button>
            <button type="button" class="history-tab" data-history-tab="post">
              내가 쓴 글
            </button>
            <button
              type="button"
              class="history-tab"
              data-history-tab="comment"
            >
              내가 쓴 댓글/답글
            </button>
          </section>

          <section
            class="history-section"
            data-history-panel="pickle"
            id="historyPickleSection"
          >
            <div class="history-section__head">
              <h2 class="history-section__title">피클 내역</h2>
              <span class="history-section__count" id="historyPickleCount"
                >0건</span
              >
            </div>
            <div id="historyPickleList" class="history-list"></div>
          </section>

          <section
            class="history-section"
            data-history-panel="post"
            id="historyPostSection"
          >
            <div class="history-section__head">
              <h2 class="history-section__title">내가 쓴 글</h2>
              <span class="history-section__count" id="historyPostCount"
                >0건</span
              >
            </div>
            <div id="historyPostList" class="history-list"></div>
          </section>

          <section
            class="history-section"
            data-history-panel="comment"
            id="historyCommentSection"
          >
            <div class="history-section__head">
              <h2 class="history-section__title">내가 쓴 댓글/답글</h2>
              <span class="history-section__count" id="historyCommentCount"
                >0건</span
              >
            </div>
            <div id="historyCommentList" class="history-list"></div>
          </section>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
