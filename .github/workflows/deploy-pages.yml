name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: games/mallin-oi-village/package-lock.json

      - name: Build 말오닷특별시
        working-directory: games/mallin-oi-village
        run: |
          npm ci
          npm run build -- --base=/games/mallin-oi-village/

      - name: Prepare Pages files
        run: |
          mkdir -p _site/games/cucumber-grow _site/games/mallin-oi-village
          cp -R account assets images partials _site/
          cp ./*.html .nojekyll CNAME site.webmanifest sw.js _site/
          cp games/cucumber-grow/index.html _site/games/cucumber-grow/
          cp -R games/cucumber-grow/assets games/cucumber-grow/css games/cucumber-grow/js _site/games/cucumber-grow/
          cp -R games/mallin-oi-village/dist/. _site/games/mallin-oi-village/
          du -sh _site
          find _site -type f | wc -l

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
