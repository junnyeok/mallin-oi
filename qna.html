<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q&A | 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />

    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
    <link rel="stylesheet" href="./assets/css/main/main.css" />
    <link rel="stylesheet" href="./assets/css/main/suggestion-qna-main.css" />
  </head>

  <body data-page="qna">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section class="home-section home-section--suggestion-page">
          <div class="container">
            <div
              class="panel suggestion-panel suggestion-panel--page"
              id="qnaSection"
            >
              <div class="panel__head">
                <div>
                  <h2 class="panel__title">❓ Q&amp;A</h2>
                  <p class="panel__desc">
                    궁금한 점을 남겨주시면 관리자가 답변해드립니다.
                  </p>
                </div>
              </div>

              <form class="suggestion-form" id="suggestionForm">
                <div class="suggestion-form__top" id="suggestionUserBox">
                  작성자: 게스트
                </div>

                <textarea
                  id="suggestionBody"
                  class="suggestion-form__textarea"
                  rows="4"
                  maxlength="1000"
                  placeholder="질문을 입력해줘."
                ></textarea>

                <div class="suggestion-secret-box">
                  <label class="suggestion-secret-toggle">
                    <input type="checkbox" id="suggestionSecretToggle" />
                    <span>비밀 질문</span>
                  </label>

                  <input
                    type="password"
                    id="suggestionSecretPassword"
                    class="suggestion-secret-input"
                    maxlength="100"
                    placeholder="비밀글 비밀번호를 입력해줘."
                    hidden
                  />

                  <p class="suggestion-secret-hint">
                    비밀글은 작성 후 본인도 비밀번호를 입력해야 확인할 수 있어.
                  </p>
                </div>

                <div class="suggestion-form__bottom">
                  <p class="suggestion-form__hint" id="suggestionLoginHint">
                    로그인 후 질문 작성이 가능해.
                  </p>

                  <button
                    type="submit"
                    class="suggestion-btn suggestion-btn--primary"
                    id="suggestionSubmitBtn"
                  >
                    등록
                  </button>
                </div>

                <p class="suggestion-form__msg" id="suggestionFormMsg"></p>
              </form>

              <div class="suggestion-list" id="suggestionList"></div>

              <div class="suggestion-pager" id="suggestionPager" hidden>
                <button
                  type="button"
                  class="suggestion-btn"
                  id="suggestionPrevBtn"
                >
                  이전
                </button>
                <div class="suggestion-pager__info" id="suggestionPageInfo">
                  1 / 1
                </div>
                <button
                  type="button"
                  class="suggestion-btn"
                  id="suggestionNextBtn"
                >
                  다음
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
