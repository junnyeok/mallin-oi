    <g class="leaf-fall" style="--duration:13.2s;--delay:-10.6s;--alpha:0.7;--still-y:350px">
      <g class="leaf-sway" style="--sway-duration:3.9s;--delay:-10.6s">
        <g transform="scale(0.546)"><g class="leaf-turn" style="--turn-duration:5.2s;--delay:-10.6s"><use href="#maple" xlink:href="#maple"/></g></g>
