<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script src="./assets/js/calendar-appearance.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이페이지 | 말린오이닷컴</title>

    <!-- 공통 css -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/social-auth.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />

    <!-- mypage 전용 -->
    <link rel="stylesheet" href="./assets/css/main/mypage-main.css" />
    <link rel="stylesheet" href="./assets/css/components/community-safety.css" />
  </head>

  <body data-page="mypage">
    <div class="page">
      <div data-include="header"></div>

      <main class="mypage-main">
        <div class="calendar-app-back-row">
          <a class="calendar-app-back-link" href="./app-calendar.html?app=calendar">
            ‹ 캘린더로 돌아가기
          </a>
        </div>

        <section class="mypage-section" id="mypageMfaGate" aria-labelledby="mypageMfaTitle">
          <h1 class="mypage-section-title" id="mypageMfaTitle">마이페이지 2차 인증</h1>
          <div id="mypageMfaProof">인증 정보를 확인하고 있어요.</div>
        </section>
        <div class="mypage-dashboard" id="mypagePrivate" hidden>
          <header class="mypage-summary">
            <div class="mypage-summary-heading">
              <h1>마이페이지</h1>
              <img src="./images/logo-home.png" alt="" width="48" height="56" />
            </div>

            <dl class="mypage-summary-grid">
              <div class="mypage-summary-email">
                <dt>이메일</dt>
                <dd id="mypageEmailText">-</dd>
              </div>
              <div>
                <dt>가입일</dt>
                <dd id="mypageCreatedAt">-</dd>
              </div>
              <div>
                <dt>내 글 수</dt>
                <dd id="mypagePostCount">0</dd>
              </div>
              <div>
                <dt>회원 구분</dt>
                <dd id="mypageRoleBadge">일반회원</dd>
              </div>
            </dl>
          </header>

          <nav class="mypage-nav" aria-label="마이페이지 메뉴">
            <button type="button" data-mypage-target="mypageForm">회원정보</button>
            <button type="button" data-mypage-target="mypageSecurity">2차 인증</button>
            <button type="button" data-mypage-target="communitySafetySettings" id="mypageCommunityShortcut" hidden>커뮤니티 설정</button>
            <button type="button" data-mypage-target="mypageAccount">계정 관리</button>
          </nav>

          <div class="mypage-content">
            <div class="mypage-column">
              <form id="mypageForm" class="mypage-panel" aria-labelledby="mypageInfoHeading" tabindex="-1">
                <section class="mypage-section" aria-labelledby="mypageInfoHeading">
                  <h2 class="mypage-section-title" id="mypageInfoHeading">기본 회원정보</h2>

                  <div class="mypage-fields">
                    <div class="mypage-field">
                      <label for="mypageEmail">이메일</label>
                      <input
                        type="email"
                        id="mypageEmail"
                        name="mypageEmail"
                        aria-describedby="mypageLoginMethod"
                        readonly
                      />
                      <p class="help-text" id="mypageLoginMethod">로그인 아이디로 쓰는 이메일이야.</p>
                    </div>

                    <div class="mypage-field">
                      <label for="mypageNickname">닉네임</label>
                      <input
                        type="text"
                        id="mypageNickname"
                        name="mypageNickname"
                        minlength="2"
                        maxlength="20"
                        placeholder="닉네임 입력"
                      />
                      <p class="help-text">닉네임은 최소 2글자 이상 입력해줘.</p>
                    </div>
                  </div>
                </section>

                <section id="mypagePasswordSection" class="mypage-section" aria-labelledby="mypagePasswordHeading">
                  <h2 class="mypage-section-title" id="mypagePasswordHeading">비밀번호 변경</h2>

                  <div class="mypage-field">
                    <label for="mypageCurrentPw">현재 비밀번호</label>
                    <input
                      type="password"
                      id="mypageCurrentPw"
                      name="mypageCurrentPw"
                      autocomplete="current-password"
                      placeholder="현재 비밀번호"
                    />
                  </div>

                  <div class="mypage-fields">
                    <div class="mypage-field">
                      <label for="mypageNewPw">새 비밀번호</label>
                      <input
                        type="password"
                        id="mypageNewPw"
                        name="mypageNewPw"
                        minlength="10"
                        maxlength="64"
                        placeholder="새 비밀번호 입력"
                        autocomplete="new-password"
                        aria-describedby="mypagePasswordHelp"
                      />
                    </div>

                    <div class="mypage-field">
                      <label for="mypageNewPw2">새 비밀번호 확인</label>
                      <input
                        type="password"
                        id="mypageNewPw2"
                        name="mypageNewPw2"
                        minlength="10"
                        maxlength="64"
                        placeholder="새 비밀번호 다시 입력"
                        autocomplete="new-password"
                      />
                    </div>
                  </div>

                  <p class="help-text" id="mypagePasswordHelp">
                    비밀번호를 바꿀 때만 입력해줘. 새 비밀번호는 영문자, 숫자, 특수기호를 포함한 10자 이상이어야 해.
                  </p>
                </section>

                <div class="mypage-form-footer">
                  <button type="submit" class="mypage-btn">회원정보 저장</button>
                  <p class="mypage-msg" id="mypageMsg" role="status"></p>
                </div>
              </form>

              <section class="mypage-panel" id="mypageSecurity" aria-labelledby="mypageMfaHeading" tabindex="-1">
                <h2 class="mypage-section-title" id="mypageMfaHeading">2차 인증 관리</h2>
                <div id="mypageMfaSettings"></div>
              </section>
            </div>

            <div class="mypage-column">
              <section class="mypage-panel" id="communitySafetySettings" aria-labelledby="mypageCommunityHeading" tabindex="-1" hidden>
                <h2 class="mypage-section-title" id="mypageCommunityHeading">커뮤니티 설정</h2>
                <div data-community-panels></div>
              </section>

              <section class="mypage-panel" id="mypageAccount" aria-labelledby="mypageAccountHeading" tabindex="-1">
                <h2 class="mypage-section-title" id="mypageAccountHeading">계정 관리</h2>
                <button type="button" class="mypage-sub-btn" id="mypageLogoutBtn">로그아웃</button>

                <div class="mypage-withdraw">
                  <h3>회원탈퇴</h3>
                  <p class="help-text">
                    탈퇴하면 계정과 프로필, 캘린더 기록 등 계정에 연결된 데이터가 삭제되며 되돌릴 수 없어.
                  </p>
                  <button type="button" class="mypage-danger-btn" id="mypageWithdrawBtn">회원탈퇴</button>
                  <p class="mypage-withdraw-msg" id="mypageWithdrawMsg" role="status"></p>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
