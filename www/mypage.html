<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이페이지 | 말린오이닷컴</title>

    <!-- 공통 css -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />

    <!-- mypage 전용 -->
    <link rel="stylesheet" href="./assets/css/main/mypage-main.css" />
  </head>

  <body data-page="mypage">
    <div class="page">
      <div data-include="header"></div>

      <main class="mypage-main">
        <div class="mypage-card">
          <div class="mypage-summary">
            <div class="mypage-summary-item">
              <span class="mypage-summary-label">이메일</span>
              <span class="mypage-summary-value" id="mypageCreatedAtLabel"
                >가입일</span
              >
            </div>

            <div class="mypage-summary-grid">
              <div class="mypage-summary-box">
                <div class="mypage-summary-box__label">이메일</div>
                <div class="mypage-summary-box__value" id="mypageEmailText">
                  -
                </div>
              </div>

              <div class="mypage-summary-box">
                <div class="mypage-summary-box__label">가입일</div>
                <div class="mypage-summary-box__value" id="mypageCreatedAt">
                  -
                </div>
              </div>

              <div class="mypage-summary-box">
                <div class="mypage-summary-box__label">내 글 수</div>
                <div class="mypage-summary-box__value" id="mypagePostCount">
                  0
                </div>
              </div>

              <div class="mypage-summary-box">
                <div class="mypage-summary-box__label">회원 구분</div>
                <div class="mypage-summary-box__value" id="mypageRoleBadge">
                  일반회원
                </div>
              </div>
            </div>
          </div>

          <form id="mypageForm" class="mypage-form">
            <section class="mypage-section" aria-label="기본 회원정보">
              <h2 class="mypage-section-title">기본 회원정보</h2>

              <div class="mypage-field">
                <label for="mypageEmail">이메일</label>
                <input
                  type="email"
                  id="mypageEmail"
                  name="mypageEmail"
                  readonly
                />
                <p class="help-text">로그인 아이디로 쓰는 이메일이야.</p>
              </div>

              <div class="mypage-field">
                <label for="mypageNickname">닉네임</label>
                <input
                  type="text"
                  id="mypageNickname"
                  name="mypageNickname"
                  minlength="2"
                  maxlength="20"
                  placeholder="닉네임 입력"
                />
                <p class="help-text">닉네임은 최소 2글자 이상 입력해줘.</p>
              </div>
            </section>

            <section class="mypage-section" aria-label="비밀번호 변경">
              <h2 class="mypage-section-title">비밀번호 변경</h2>

              <div class="mypage-field">
                <label for="mypageCurrentPw">현재 비밀번호</label>
                <input
                  type="password"
                  id="mypageCurrentPw"
                  name="mypageCurrentPw"
                  autocomplete="current-password"
                  placeholder="현재 비밀번호"
                />
                <p class="help-text">
                  비밀번호를 바꾸려면 현재 비밀번호를 먼저 입력해줘.
                </p>
              </div>

              <div class="mypage-field">
                <label for="mypageNewPw">새 비밀번호</label>
                <input
                  type="password"
                  id="mypageNewPw"
                  name="mypageNewPw"
                  minlength="10"
                  maxlength="64"
                  placeholder="영문자+숫자+특수기호 10자이상"
                  autocomplete="new-password"
                />
                <p class="help-text">
                  비밀번호를 바꾸지 않을 거면 비워둬도 돼. 바꾼다면
                  영문자+숫자+특수기호를 포함한 10자 이상이어야 해.
                </p>
              </div>

              <div class="mypage-field">
                <label for="mypageNewPw2">새 비밀번호 확인</label>
                <input
                  type="password"
                  id="mypageNewPw2"
                  name="mypageNewPw2"
                  minlength="10"
                  maxlength="64"
                  placeholder="새 비밀번호 다시 입력"
                  autocomplete="new-password"
                />
              </div>
            </section>

            <button type="submit" class="mypage-btn">회원정보 저장</button>

            <p class="mypage-msg" id="mypageMsg"></p>
          </form>

          <section
            class="mypage-section mypage-section--account"
            aria-label="계정 관리"
          >
            <h2 class="mypage-section-title">계정 관리</h2>

            <div class="mypage-action-row">
              <button type="button" class="mypage-sub-btn" id="mypageLogoutBtn">
                로그아웃
              </button>
            </div>
          </section>

          <section
            class="mypage-section mypage-section--danger"
            aria-label="회원탈퇴"
          >
            <h2 class="mypage-section-title">회원탈퇴</h2>
            <p class="help-text">
              탈퇴하면 계정과 프로필, 캘린더 기록 등 계정에 연결된 데이터가
              삭제되며 되돌릴 수 없어.
            </p>
            <div class="mypage-action-row">
              <button
                type="button"
                class="mypage-danger-btn"
                id="mypageWithdrawBtn"
              >
                회원탈퇴
              </button>
            </div>
            <p class="mypage-withdraw-msg" id="mypageWithdrawMsg"></p>
          </section>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
