<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>캘린더 그룹 - 말린오이닷컴</title>

    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png" />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <script>
      (() => {
        const key = 'mallin:calendar-app-mode';
        const params = new URLSearchParams(window.location.search);
        const hasCalendarQuery = params.get('app') === 'calendar';
        const isNativeCalendarApp =
          window.Capacitor?.isNativePlatform?.() === true;

        try {
          if (hasCalendarQuery) sessionStorage.setItem(key, 'calendar');
        } catch {}

        if (hasCalendarQuery || isNativeCalendarApp) {
          document.documentElement.classList.add('is-calendar-app-mode');
        }
      })();
    </script>

    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
    <link
      rel="stylesheet"
      href="./assets/css/components/calendar-app-download-popup.css"
    />
    <link rel="stylesheet" href="./assets/css/main/main.css" />
    <link rel="stylesheet" href="./assets/css/main/app-calendar-main.css" />
    <link rel="stylesheet" href="./assets/css/main/calendar-groups-main.css" />
  </head>

  <body class="theme-home" data-page="calendar-groups">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section class="home-section calendar-groups-page" id="calendarGroupsPage">
          <div class="container">
            <div class="calendar-groups-page__head">
              <div>
                <p class="calendar-groups-page__eyebrow">캘린더 공유</p>
                <h1 class="calendar-groups-page__title">캘린더 그룹</h1>
                <p class="calendar-groups-page__desc">
                  자기개발, 업무, 이벤트 캘린더 중 선택한 종류만 그룹 멤버와 함께 볼 수 있어.
                </p>
              </div>
              <a class="calendar-groups-page__back" href="./calendar-study.html">캘린더 선택</a>
            </div>

            <p class="calendar-groups-status" id="calendarGroupsStatus" aria-live="polite">
              그룹 목록을 불러오는 중...
            </p>

            <div class="calendar-groups-layout">
              <section class="panel calendar-groups-panel">
                <h2 class="calendar-groups-panel__title">참여 가능한 그룹</h2>
                <div class="calendar-group-list" id="calendarVisibleGroups"></div>
              </section>

              <section class="panel calendar-groups-panel">
                <h2 class="calendar-groups-panel__title">내 그룹</h2>
                <div class="calendar-group-list" id="calendarMyGroups"></div>
              </section>

              <section class="panel calendar-groups-panel" id="calendarHiddenGroupsPanel">
                <div class="calendar-groups-panel__head">
                  <h2 class="calendar-groups-panel__title">숨긴 그룹방 목록</h2>
                  <button
                    class="calendar-groups-panel__ghost"
                    id="calendarGroupHiddenToggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="calendarHiddenGroups"
                  >
                    숨긴 그룹 보기
                  </button>
                </div>
                <div class="calendar-group-list" id="calendarHiddenGroups" hidden></div>
              </section>

              <section class="panel calendar-groups-panel">
                <div class="calendar-groups-panel__head">
                  <h2 class="calendar-groups-panel__title">그룹 만들기</h2>
                  <button
                    class="calendar-groups-panel__ghost"
                    id="calendarGroupCreateToggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="calendarGroupCreatePanel"
                  >
                    + 그룹 만들기
                  </button>
                </div>
                <div id="calendarGroupCreatePanel" hidden>
                <form class="calendar-group-form" id="calendarGroupForm">
                  <label class="calendar-group-form__field">
                    <span>그룹 이름</span>
                    <input name="name" type="text" maxlength="30" autocomplete="off" required />
                  </label>

                  <label class="calendar-group-form__field">
                    <span>그룹 소개</span>
                    <textarea
                      name="description"
                      maxlength="100"
                      rows="3"
                      placeholder="그룹을 짧게 소개해줘."
                    ></textarea>
                  </label>

                  <fieldset class="calendar-group-form__set">
                    <legend>그룹 색상</legend>
                    <div class="calendar-group-colors" id="calendarGroupColors"></div>
                  </fieldset>

                  <fieldset class="calendar-group-form__set">
                    <legend>연동 캘린더</legend>
                    <label><input type="checkbox" name="allowStudy" checked /> 자기개발</label>
                    <label><input type="checkbox" name="allowWork" checked /> 업무</label>
                    <label><input type="checkbox" name="allowEvent" /> 이벤트</label>
                  </fieldset>

                  <fieldset class="calendar-group-form__set calendar-group-form__set--common">
                    <legend>운영 방식</legend>
                    <label><input type="checkbox" name="isCommonCalendar" /> 공통 그룹 캘린더로 만들기</label>
                    <p>그룹장이 하나의 공통 캘린더를 관리하고, 그룹원은 같은 일정을 함께 확인해요. 개인 캘린더 백업 공유 방식과 다르게 운영돼요.</p>
                  </fieldset>

                  <fieldset class="calendar-group-form__set">
                    <legend>공개 설정</legend>
                    <label><input type="checkbox" name="isPrivate" id="calendarGroupPrivate" /> 비공개 그룹</label>
                    <label><input type="checkbox" name="isHidden" /> 일반 목록에서 숨기기</label>
                  </fieldset>

                  <label class="calendar-group-form__field">
                    <span>비밀번호</span>
                    <input
                      id="calendarGroupPassword"
                      name="password"
                      type="password"
                      autocomplete="new-password"
                      placeholder="비공개 그룹에서만 사용"
                    />
                  </label>

                  <button class="calendar-group-form__submit" type="submit">그룹 만들기</button>
                </form>
                </div>
              </section>
            </div>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
