<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시물 | 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <!-- 공통 -->
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/weekly-nav-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/post-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />

    <!-- main -->
    <link rel="stylesheet" href="./assets/css/main/post-main.css" />
    <link rel="stylesheet" href="./assets/css/main/posts-all-main.css" />
  </head>

  <body class="theme-home" data-page="post">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section class="post">
          <div class="container">
            <div class="post__top">
              <a class="post__back" href="#" id="postBack">← 뒤로가기</a>
            </div>

            <article class="post-card" aria-labelledby="postTitle">
              <header class="post-head">
                <div class="post-head__top">
                  <div class="post-meta">
                    <span class="chip" id="postCategory">category</span>
                    <span class="chip chip--muted" id="postViews">👀 0</span>
                    <span class="chip chip--muted" id="postReactionMeta"
                      >👍 0</span
                    >
                    <span class="chip chip--muted" id="postCommentMeta"
                      >💬 0</span
                    >
                  </div>

                  <div
                    class="post-owner-actions"
                    id="postOwnerActions"
                    hidden
                    aria-label="게시물 관리"
                  >
                    <button
                      type="button"
                      class="post-owner-btn"
                      id="postEditBtn"
                    >
                      수정
                    </button>
                    <button
                      type="button"
                      class="post-owner-btn post-owner-btn--danger"
                      id="postDeleteBtn"
                    >
                      삭제
                    </button>
                  </div>
                </div>

                <h1 class="post-title" id="postTitle">로딩중...</h1>
                <p class="post-excerpt" id="postExcerpt"></p>

                <div class="post-author-meta-block">
                  <p class="post-author" id="postAuthor">작성자 : -</p>
                  <p class="post-datetime" id="postDateTime">
                    작성일 : 0000.00.00 00:00
                  </p>
                </div>

                <div class="post-tags" id="postTags"></div>
              </header>

              <hr class="post-divider" />

              <!-- 비밀글 잠금 박스 -->
              <div class="post-secret" id="postSecretBox" hidden>
                <div class="post-secret__card">
                  <p class="post-secret__title">🔒 비밀글이야</p>
                  <p class="post-secret__desc">
                    이 글은 비밀번호를 입력한 사람만 볼 수 있어.
                  </p>

                  <form id="postSecretForm" class="post-secret__form">
                    <input
                      type="password"
                      id="postSecretPassword"
                      maxlength="30"
                      placeholder="비밀번호 입력"
                      autocomplete="current-password"
                    />
                    <button type="submit" class="post-owner-btn">확인</button>
                  </form>

                  <p class="post-secret__msg" id="postSecretMsg"></p>
                </div>
              </div>

              <section class="post-body" id="postBody">
                <p class="post-body__hint">본문을 불러오는 중이야.</p>
              </section>

              <div id="postAttachments"></div>
            </article>

            <section
              class="post-reactions"
              id="postReactionsSection"
              aria-label="좋아요 참신해요"
            >
              <div class="post-reactions__inner">
                <button
                  type="button"
                  class="post-reaction-btn"
                  id="postLikeBtn"
                  data-reaction="like"
                  aria-pressed="false"
                >
                  <span class="post-reaction-btn__icon" aria-hidden="true">
                    <img src="./images/good.png" alt="" />
                  </span>
                  <span class="post-reaction-btn__label">
                    좋아요
                    <span class="post-reaction-btn__count" id="postLikeCount"
                      >0</span
                    >
                  </span>
                </button>

                <button
                  type="button"
                  class="post-reaction-btn post-reaction-btn--bad"
                  id="postDislikeBtn"
                  data-reaction="dislike"
                  aria-pressed="false"
                >
                  <span class="post-reaction-btn__icon" aria-hidden="true">
                    <img src="./images/bad.png" alt="" />
                  </span>
                  <span class="post-reaction-btn__label">
                    참신해요
                    <span class="post-reaction-btn__count" id="postDislikeCount"
                      >0</span
                    >
                  </span>
                </button>
              </div>
            </section>

            <nav class="post-pager" aria-label="이전글 다음글">
              <a
                href="#"
                id="postPrevBtn"
                class="post-pager__btn"
                aria-disabled="true"
              >
                ← 이전글
              </a>

              <a
                href="./posts-all.html"
                id="postListBtn"
                class="post-pager__btn post-pager__btn--center"
              >
                목록
              </a>

              <a
                href="#"
                id="postNextBtn"
                class="post-pager__btn"
                aria-disabled="true"
              >
                다음글 →
              </a>
            </nav>

            <section
              class="post-comments"
              id="postCommentsSection"
              aria-label="댓글"
            >
              <div class="post-comments__head">
                <h2 class="post-comments__title">
                  댓글 <span id="commentCount">0</span>
                </h2>
                <p class="post-comments__desc" id="commentLoginHint">
                  로그인 상태야. 댓글과 답글을 남길 수 있어.
                </p>
              </div>

              <form class="comment-form" id="commentForm">
                <div class="comment-form__top">
                  <div class="comment-form__user" id="commentUserBox">
                    작성자: 게스트
                  </div>
                </div>

                <label class="comment-form__field" for="commentBody">
                  <span class="comment-form__label">댓글</span>
                  <textarea
                    id="commentBody"
                    name="commentBody"
                    class="comment-form__textarea"
                    rows="4"
                    maxlength="500"
                    placeholder="댓글을 입력해줘. (최대 500자)"
                  ></textarea>
                </label>

                <div class="comment-form__bottom">
                  <p class="comment-form__msg" id="commentFormMsg"></p>
                  <button
                    type="submit"
                    class="weekly-nav__btn comment-form__submit"
                    id="commentSubmitBtn"
                  >
                    등록
                  </button>
                </div>
              </form>

              <div class="comment-list" id="commentList">
                <div class="comment-empty">댓글을 불러오는 중이야.</div>
              </div>
            </section>

            <section
              class="post-detail-list posts-all__list"
              id="postOtherPostsSection"
              aria-label="다른 게시물 목록"
            >
              <div class="post-detail-list__head">
                <h2 class="post-detail-list__title">다른 게시물</h2>
              </div>

              <div class="posts-all__rows" id="detailPostList"></div>

              <div
                class="post-detail-list__pager post posts-all__pager"
                aria-label="목록 페이지네이션"
              >
                <button
                  type="button"
                  class="weekly-nav__btn"
                  id="detailPrevBtn"
                  aria-label="이전 페이지"
                >
                  ←
                </button>

                <span class="post-detail-list__page" id="detailPageInfo"
                  >1 / 1</span
                >

                <button
                  type="button"
                  class="weekly-nav__btn"
                  id="detailNextBtn"
                  aria-label="다음 페이지"
                >
                  →
                </button>
              </div>
            </section>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
