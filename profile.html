<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내프로필 | 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/main/profile-main.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
  </head>
  <body data-page="profile">
    <div class="page">
      <div data-include="header"></div>

      <main class="profile-main">
        <div class="profile-card">
          <section class="profile-hero">
            <div class="profile-avatar-wrap">
              <img
                id="profileAvatar"
                class="profile-avatar"
                src="./images/logo-home.png"
                alt="프로필 사진"
              />
            </div>

            <div class="profile-hero__content">
              <div class="profile-hero__top">
                <div class="profile-hero__text">
                  <p
                    class="profile-hero__eyebrow"
                    id="profileEyebrow"
                    hidden
                  ></p>
                  <h1 class="profile-hero__nickname" id="profileNicknameText">
                    -
                  </h1>
                  <p
                    class="profile-hero__meta"
                    id="profileEmailText"
                    hidden
                  ></p>
                  <p class="profile-hero__desc" id="profileDesc"></p>
                </div>

                <a
                  id="profileSettingLink"
                  class="profile-setting-link"
                  href="./profile-setting.html"
                >
                  프로필 설정
                </a>
              </div>

              <div class="profile-hero__summary-row">
                <p class="profile-hero__pickle" id="profileHeroPickle" hidden>
                  보유 피클 0 🥒
                </p>

                <a
                  id="profileHistoryLink"
                  class="profile-setting-link is-secondary profile-history-shortcut"
                  href="./profile-history.html"
                >
                  피클 · 글 · 댓글 내역 보기
                </a>
              </div>
            </div>
          </section>

          <section
            class="profile-section profile-character-section"
            id="profileCharacterSection"
            aria-label="내 캐릭터"
          >
            <div class="profile-character-preview">
              <img
                id="profileCharacterImage"
                class="profile-character-image"
                src="./images/characters/cucumber.png"
                alt="기본 캐릭터"
              />
            </div>

            <div class="profile-character-actions">
              <a
                id="profileInventoryLink"
                class="profile-inventory-link"
                href="./inventory.html"
              >
                인벤토리 관리
              </a>
            </div>
          </section>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
