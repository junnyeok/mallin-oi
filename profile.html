<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내프로필 | 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/main/profile-main.css" />
  </head>
  <body data-page="profile">
    <div class="page">
      <div data-include="header"></div>

      <main class="profile-main">
        <div class="profile-card">
          <section class="profile-hero">
            <div class="profile-avatar-wrap">
              <img
                id="profileAvatar"
                class="profile-avatar"
                src="./images/logo-home.png"
                alt="프로필 사진"
              />
            </div>

            <div class="profile-hero__content">
              <p class="profile-hero__eyebrow" id="profileEyebrow">내프로필</p>
              <h1 class="profile-hero__nickname" id="profileNicknameText">-</h1>
              <p class="profile-hero__meta" id="profileEmailText">-</p>
              <p class="profile-hero__desc" id="profileDesc">
                여기서는 프로필 사진, 닉네임, 내가 쓴 글/댓글을 한 번에 볼 수
                있어.
              </p>
              <p class="profile-hero__pickle" id="profileHeroPickle" hidden>
                보유 피클 0 🥒
              </p>
            </div>
          </section>

          <form id="profileForm" class="profile-form">
            <section class="profile-section" aria-label="프로필 설정">
              <h2 class="profile-section-title" id="profileFormTitle">
                프로필 설정
              </h2>
              <div class="profile-field">
                <label for="profileNickname">닉네임</label>
                <input
                  type="text"
                  id="profileNickname"
                  name="profileNickname"
                  minlength="2"
                  maxlength="20"
                  placeholder="닉네임 입력"
                />
              </div>

              <div class="profile-field">
                <label for="profileImageFile">프로필 사진</label>
                <input
                  type="file"
                  id="profileImageFile"
                  name="profileImageFile"
                  accept="image/png,image/jpeg,image/webp,image/gif"
                />
                <p class="help-text">
                  JPG, PNG, WEBP, GIF 파일만 가능하고, 5MB 이하만 업로드할 수
                  있어.
                </p>
              </div>

              <div class="profile-actions">
                <button type="submit" class="profile-btn">프로필 저장</button>
                <button
                  type="button"
                  class="profile-sub-btn"
                  id="profileResetImageBtn"
                >
                  기본 이미지로 변경
                </button>
              </div>

              <p class="profile-msg" id="profileMsg"></p>
            </section>
          </form>

          <section
            class="profile-section"
            id="profilePickleSection"
            aria-label="피클 내역"
            hidden
          >
            <div class="profile-section-head">
              <h2 class="profile-section-title">피클 내역</h2>
              <div class="profile-pickle-balance">
                보유 피클 <strong id="profilePickleBalance">0 🥒</strong>
              </div>
            </div>

            <div id="profilePickleList" class="profile-list"></div>

            <div class="profile-pager" aria-label="피클 내역 페이지네이션">
              <button
                type="button"
                class="profile-sub-btn"
                id="profilePicklePrevBtn"
              >
                이전
              </button>
              <span class="profile-pager__info" id="profilePicklePageInfo"
                >1 / 1</span
              >
              <button
                type="button"
                class="profile-sub-btn"
                id="profilePickleNextBtn"
              >
                다음
              </button>
            </div>
          </section>

          <section
            class="profile-section"
            id="profileMyPostsSection"
            aria-label="내가 쓴 글"
          >
            <h2 class="profile-section-title" id="profilePostsTitle">
              내가 쓴 글
            </h2>
            <div id="profilePostList" class="profile-list"></div>

            <div class="profile-pager" aria-label="내가 쓴 글 페이지네이션">
              <button
                type="button"
                class="profile-sub-btn"
                id="profilePostPrevBtn"
              >
                이전
              </button>
              <span class="profile-pager__info" id="profilePostPageInfo"
                >1 / 1</span
              >
              <button
                type="button"
                class="profile-sub-btn"
                id="profilePostNextBtn"
              >
                다음
              </button>
            </div>
          </section>

          <section class="profile-section" aria-label="내가 쓴 댓글">
            <h2 class="profile-section-title" id="profileCommentsTitle">
              내가 쓴 댓글
            </h2>
            <div id="profileCommentList" class="profile-list"></div>

            <div class="profile-pager" aria-label="내가 쓴 댓글 페이지네이션">
              <button
                type="button"
                class="profile-sub-btn"
                id="profileCommentPrevBtn"
              >
                이전
              </button>
              <span class="profile-pager__info" id="profileCommentPageInfo"
                >1 / 1</span
              >
              <button
                type="button"
                class="profile-sub-btn"
                id="profileCommentNextBtn"
              >
                다음
              </button>
            </div>
          </section>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
