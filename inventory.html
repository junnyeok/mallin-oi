<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인벤토리 | 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />

    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link
      rel="stylesheet"
      href="./assets/css/components/character-effects.css"
    />
    <link rel="stylesheet" href="./assets/css/main/profile-main.css" />
    <link rel="stylesheet" href="./assets/css/main/inventory-main.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
  </head>
  <body data-page="inventory">
    <div class="page">
      <div data-include="header"></div>

      <main class="profile-main inventory-main">
        <div class="profile-card inventory-card">
          <section
            class="profile-section inventory-intro"
            aria-label="인벤토리 소개"
          >
            <p class="profile-hero__eyebrow">내 인벤토리</p>
            <h1 class="profile-section-title inventory-title">
              캐릭터 / 스킨 / BGM 관리
            </h1>
            <p class="profile-hero__desc inventory-desc">
              여기서 현재 사용할 캐릭터, 스킨, 효과, 배경, 테두리, BGM을 선택할
              수 있어.
            </p>
          </section>

          <section
            class="profile-section profile-character-section"
            id="profileCharacterSection"
            aria-label="내 인벤토리"
          >
            <div class="profile-character-preview character-effect-wrap">
              <img
                id="profileCharacterImage"
                class="profile-character-image"
                src="./images/characters/cucumber.png"
                alt="현재 캐릭터"
              />
            </div>

            <div class="profile-character-actions">
              <a
                class="profile-inventory-link is-secondary"
                href="./profile.html"
              >
                내프로필로 돌아가기
              </a>
            </div>

            <p class="profile-msg inventory-msg" id="profileMsg"></p>

            <div
              id="profileCharacterCharacterWrap"
              class="profile-character-inventory"
            >
              <span
                id="character-inventory"
                class="inventory-anchor"
                aria-hidden="true"
              ></span>

              <div class="profile-character-inventory__head">
                <h3 class="profile-character-inventory__title">캐릭터</h3>

                <label
                  class="profile-character-toggle"
                  for="profileOwnedOnlyToggle"
                >
                  <input type="checkbox" id="profileOwnedOnlyToggle" />
                  <span>보유중</span>
                </label>
              </div>

              <div
                id="profileCharacterList"
                class="profile-character-grid profile-character-grid--characters"
              ></div>
            </div>

            <div
              id="profileCharacterSkinWrap"
              class="profile-character-inventory"
            >
              <span
                id="skin-inventory"
                class="inventory-anchor"
                aria-hidden="true"
              ></span>

              <h3
                class="profile-character-inventory__title"
                id="profileCharacterSkinTitle"
              >
                스킨
              </h3>

              <div
                id="profileCharacterSkinList"
                class="profile-character-grid profile-character-grid--skins"
              ></div>
            </div>

            <div
              id="profileCharacterEffectWrap"
              class="profile-character-inventory"
            >
              <span
                id="character-effect-inventory"
                class="inventory-anchor"
                aria-hidden="true"
              ></span>

              <h3 class="profile-character-inventory__title">
                캐릭터 효과 인벤토리
              </h3>

              <div
                id="profileCharacterEffectList"
                class="profile-character-grid profile-character-grid--effects"
              ></div>
            </div>

            <div id="profileBgmWrap" class="profile-character-inventory">
              <span
                id="bgm-inventory"
                class="inventory-anchor"
                aria-hidden="true"
              ></span>

              <h3 class="profile-character-inventory__title">BGM 인벤토리</h3>

              <div
                id="profileBgmList"
                class="profile-character-grid profile-character-grid--bgm"
              ></div>
            </div>
          </section>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
