<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>이벤트 알람 로컬 검증</title>
  <link rel="stylesheet" href="../../assets/css/01-tokens.css">
  <link rel="stylesheet" href="../../assets/css/components/calendar-entry-sheet.css?alarm-fixture=7">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-base); background: var(--color-bg); color: var(--color-text); }
    main { padding: 24px; }
    main button { padding: 12px; font: inherit; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body class="theme-event">
  <main><h1>이벤트 알람 로컬 검증</h1><p>실제 계정·일정 데이터에 접근하지 않는 검증 화면입니다.</p>
    <button id="open" type="button">일정 열기</button><button id="inspect" type="button">저장된 알람 확인</button><button id="clear" type="button">테스트 알람 해제</button><p id="result" role="status"></p></main>
  <script type="module">
    import { openCalendarDetailSheet } from '../../assets/js/modules/calendar-entry-sheet.js?alarm-fixture=6';
    import { createEventAlarmEditor, cancelEventAlarms } from '../../assets/js/modules/event-alarm-picker.js?alarm-fixture=7';
    import { toAlarmDateTimeValue, getEventAlarmPlugin } from '../../assets/js/modules/event-alarm.js';
    const query = new URLSearchParams(location.search);
    const mode = query.get('mock');
    const key = 'event:local-fixture:alarm-test-v2';
    const webKey = `mallinoi.event-alarm.v2:${key}`;
    if (query.has('legacy')) localStorage.setItem(webKey, '{old-invalid-web-alarm');
    const initialWebAlarm = localStorage.getItem(webKey);
    let record = null, dbWrites = 0, alarmWrites = 0, settingsOpened = 0;
    let downloads = 0;
    document.addEventListener('click', (event) => { if (event.target.closest('a[download]')) downloads++; });
    const result = document.querySelector('#result');
    if (mode) window.Capacitor = { isNativePlatform: () => true, registerPlugin: () => ({
      getPermission: async () => ({ allowed: mode !== 'denied' }),
      requestPermission: async () => ({ allowed: mode !== 'denied' }),
      openSettings: async () => { settingsOpened++; result.textContent = `설정 이동 ${settingsOpened}회`; },
      getSettings: async () => record || { selection: [] },
      replace: async (value) => {
        alarmWrites++;
        if (mode === 'alarm-error') throw new Error('네이티브 등록 실패 (검증용)');
        record = value;
        result.textContent = JSON.stringify({ dbWrites, alarmWrites, settingsOpened, ...record });
        return { scheduled: true };
      },
    }) };
    document.querySelector('#inspect').addEventListener('click', async () => { result.textContent = JSON.stringify(await getEventAlarmPlugin()?.getSettings({key})); });
    document.querySelector('#clear').addEventListener('click', async () => {
      await cancelEventAlarms(key); result.textContent = '테스트 알람 해제 완료';
    });
    const opener = document.querySelector('#open');
    opener.addEventListener('click', () => {
      const date = new Date(); date.setDate(date.getDate() + 1); date.setHours(18, 0, 0, 0);
      if (query.has('near')) { date.setTime(Date.now() + 360000); date.setSeconds(0, 0); }
      const start = toAlarmDateTimeValue(date);
      let editor;
      openCalendarDetailSheet({
        calendarType: 'event', opener,
        onSave: async (values) => {
          const event = { title: values.title, startValue: values.eventStart, endValue: values.eventEnd };
          try {
            const prepared = await editor.prepare(event);
            if (mode === 'save-error') throw new Error('일정 저장 실패 (검증용)');
            dbWrites++;
            await editor.commit(key, event, prepared);
            result.textContent = JSON.stringify({ dbWrites, alarmWrites, settingsOpened, downloads,
              webStorageUnchanged: localStorage.getItem(webKey) === initialWebAlarm, ...prepared });
          } catch (error) { editor.showError(error); throw error; }
        },
        fields: [
          { key: 'title', value: '가족식사참치회' },
          { key: 'category', label: '카테고리', type: 'select', value: 'event', options: [{ value: 'event', label: '일정 🍀' }] },
          { key: 'eventStart', label: '시작', type: 'calendar-datetime', value: start, allowEmptyTime: true },
          { key: 'eventEnd', label: '종료', type: 'calendar-datetime', value: start.slice(0, 10), allowEmptyTime: true, timePlaceholder: '종료시간 지정' },
          { key: 'memo', label: '메모', type: 'textarea', value: '' },
          { key: 'alarm', type: 'custom', render: ({ getValue }) => {
            editor = createEventAlarmEditor({ key, getEvent: () => ({ title: getValue('title'), startValue: getValue('eventStart'), endValue: getValue('eventEnd') }) });
            return editor;
          } },
        ],
      });
    });
  </script>
</body>
</html>
