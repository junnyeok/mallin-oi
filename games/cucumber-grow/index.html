<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#dff3dc" />
    <meta
      name="description"
      content="여러 텃밭의 오이를 심고 물주며 성장시켜 수확하는 모바일 육성형 웹게임"
    />
    <title>오이키우기</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./css/game.css?v=20260731-01" />
  </head>
  <body>
    <main class="game-shell" id="gameApp" aria-label="오이키우기">
      <header class="sky-header">
        <div class="sky-header__clouds" aria-hidden="true">
          <span class="cloud cloud--one"></span>
          <span class="cloud cloud--two"></span>
        </div>
        <section class="game-hud" aria-label="현재 게임 상태">
          <div class="game-hud__item">
            <span>보유 오이</span>
            <strong>
              <span id="cucumberCount">0</span>
              <small>개</small>
            </strong>
          </div>
          <div class="game-hud__item">
            <span>자동 경험치</span>
            <strong><span id="productionRate">0</span> XP/초</strong>
          </div>
          <div class="game-hud__item">
            <span>물주기 경험치</span>
            <strong><span id="touchYield">1</span> XP</strong>
          </div>
          <button
            class="menu-button"
            id="menuButton"
            type="button"
            aria-haspopup="dialog"
            aria-controls="menuModal"
          >
            메뉴
          </button>
        </section>
      </header>

      <section class="garden-world" aria-labelledby="gardenWorldTitle">
        <h1 class="visually-hidden" id="gardenWorldTitle">나의 텃밭</h1>
        <div class="plot-list" id="plotList"></div>
        <div
          class="garden-empty-land"
          id="gardenEmptyLand"
          role="status"
          aria-label="보유한 텃밭이 없습니다. 메뉴의 상점에서 첫 텃밭을 구매할 수 있습니다."
        >
          <span class="garden-empty-land__patch" aria-hidden="true"></span>
        </div>
      </section>
    </main>

    <div
      class="modal-backdrop"
      id="menuModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="menuModalTitle"
      hidden
    >
      <section class="modal-card menu-card">
        <header class="modal-card__header">
          <div>
            <p class="modal-card__eyebrow">CUCUMBER FARM</p>
            <h2 id="menuModalTitle">메뉴</h2>
          </div>
          <button
            class="icon-button"
            id="menuCloseButton"
            type="button"
            aria-label="메뉴 닫기"
          >
            ×
          </button>
        </header>

        <div id="menuPanel">
          <button class="menu-entry" id="shopMenuButton" type="button">
            <span class="menu-entry__icon" aria-hidden="true">♧</span>
            <span>
              <strong>상점</strong>
              <small>텃밭 구매</small>
            </span>
            <span class="menu-entry__arrow" aria-hidden="true">›</span>
          </button>
        </div>

        <div id="shopPanel" hidden>
          <button class="back-button" id="shopBackButton" type="button">
            <span aria-hidden="true">‹</span>
            메뉴
          </button>
          <section class="shop-item" id="gardenShopItem">
            <div class="shop-item__art" aria-hidden="true">
              <span></span>
            </div>
            <div class="shop-item__copy">
              <p class="shop-item__eyebrow">GARDEN</p>
              <h3 id="gardenShopTitle">텃밭</h3>
              <p id="gardenShopDescription">작물 슬롯 4개</p>
            </div>
            <strong class="shop-item__price" id="gardenShopPrice"
              >현재 무료</strong
            >
            <button
              class="primary-button shop-item__button"
              id="gardenPurchaseButton"
              type="button"
            >
              무료 구매
            </button>
          </section>
        </div>
      </section>
    </div>

    <div
      class="modal-backdrop"
      id="offlineModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="offlineModalTitle"
      hidden
    >
      <section class="modal-card">
        <div class="modal-card__icon" aria-hidden="true">☀</div>
        <p class="modal-card__eyebrow">WELCOME BACK</p>
        <h2 id="offlineModalTitle">쉬는 동안 자랐어요!</h2>
        <dl class="offline-summary">
          <div>
            <dt>자리를 비운 시간</dt>
            <dd id="offlineDuration">0초</dd>
          </div>
          <div>
            <dt>자동 획득 경험치</dt>
            <dd><span id="offlineReward">0</span> XP</dd>
          </div>
        </dl>
        <button class="primary-button" id="offlineConfirmButton" type="button">
          성장 확인
        </button>
      </section>
    </div>

    <p class="visually-hidden" id="gameAnnouncement" aria-live="polite"></p>

    <script type="module" src="./js/main.js?v=20260731-01"></script>
  </body>
</html>
