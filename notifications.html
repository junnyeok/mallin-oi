<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>알림 | 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />

    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
    <link rel="stylesheet" href="./assets/css/main/main.css" />
    <link rel="stylesheet" href="./assets/css/main/notifications-main.css" />
  </head>

  <body data-page="notifications">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main notifications-main">
        <div class="container">
          <div
            class="notifications-page"
            data-notifications-page
            aria-busy="true"
          >
            <section class="notifications-page__intro">
              <div>
                <h1 class="notifications-page__title">🔔 알림</h1>
                <p class="notifications-page__description">
                  좋아요, 참신해요, 댓글 등 내 활동에 도착한 알림을 확인할 수
                  있어.
                </p>
              </div>

              <button
                class="notifications-page__refresh"
                id="notificationsPageRefreshBtn"
                type="button"
              >
                새로고침
              </button>
            </section>

            <section
              class="notifications-section"
              data-notification-section="unread"
              aria-busy="true"
            >
              <div class="notifications-section__header">
                <h2 class="notifications-section__title">확인하지 않은 알림</h2>
                <p class="notifications-section__description">
                  아직 확인하지 않은 알림을 모아서 보여주고 있어.
                </p>
              </div>

              <p
                class="notifications-section__status"
                id="notificationsUnreadStatus"
                aria-live="polite"
              >
                확인하지 않은 알림을 불러오는 중이야.
              </p>

              <div
                class="notifications-list"
                id="notificationsUnreadList"
                aria-label="확인하지 않은 알림 목록"
              >
                <div
                  class="notifications-page-state notifications-page-state--loading"
                  role="status"
                >
                  확인하지 않은 알림을 확인하는 중이야.
                </div>
              </div>

              <nav
                class="notifications-pagination"
                id="notificationsUnreadPagination"
                aria-label="확인하지 않은 알림 페이지"
                hidden
              ></nav>
            </section>

            <section
              class="notifications-section"
              data-notification-section="all"
              aria-busy="true"
            >
              <div class="notifications-section__header">
                <h2 class="notifications-section__title">전체 알림</h2>
                <p class="notifications-section__description">
                  최근 알림부터 확인할 수 있어.
                </p>
              </div>

              <p
                class="notifications-section__status"
                id="notificationsAllStatus"
                aria-live="polite"
              >
                전체 알림을 불러오는 중이야.
              </p>

              <div
                class="notifications-list"
                id="notificationsAllList"
                aria-label="전체 알림 목록"
              >
                <div
                  class="notifications-page-state notifications-page-state--loading"
                  role="status"
                >
                  전체 알림을 확인하는 중이야.
                </div>
              </div>

              <nav
                class="notifications-pagination"
                id="notificationsAllPagination"
                aria-label="전체 알림 페이지"
                hidden
              ></nav>
            </section>
          </div>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
