<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>자기개발 캘린더 - 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <script>
      (() => {
        const key = 'mallin:calendar-app-mode';
        const params = new URLSearchParams(window.location.search);
        const hasCalendarQuery = params.get('app') === 'calendar';
        const isNativeCalendarApp =
          window.Capacitor?.isNativePlatform?.() === true;

        try {
          if (hasCalendarQuery) sessionStorage.setItem(key, 'calendar');
        } catch {
          // sessionStorage가 막힌 환경이면 무시
        }

        if (hasCalendarQuery || isNativeCalendarApp) {
          document.documentElement.classList.add('is-calendar-app-mode');
        }
      })();
    </script>

    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
    <link
      rel="stylesheet"
      href="./assets/css/components/calendar-app-download-popup.css"
    />

    <link rel="stylesheet" href="./assets/css/main/main.css" />
    <link rel="stylesheet" href="./assets/css/main/calendar-study-main.css" />
    <link rel="stylesheet" href="./assets/css/main/app-calendar-main.css" />
    <link rel="stylesheet" href="./assets/css/main/calendar-groups-main.css" />
  </head>

  <body class="theme-study" data-page="calendar-study">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section
          class="home-section study-calendar-page"
          id="studyCalendarPage"
        >
          <div class="container">
            <div class="study-calendar-page__head">
              <div>
                <h1 class="study-calendar-page__title">🗓️ 자기개발 캘린더</h1>
                <p class="study-calendar-page__desc">
                  날짜별로 공부, 운동, 자기관리 할 일을 기록하고 완료
                  체크해보세요.
                  <br />계정별로 기록 되므로 다른 사람은 볼 수 없으니
                  걱정마세요!
                </p>
              </div>
            </div>

            <div class="study-calendar-layout">
              <section
                class="panel study-calendar-main-panel"
                aria-labelledby="studyCalendarMonthLabel"
              >
                <div class="study-calendar-toolbar">
                  <button
                    type="button"
                    class="study-calendar-nav-btn"
                    id="studyCalendarPrevBtn"
                    aria-label="이전 달 보기"
                  >
                    ‹
                  </button>

                  <h2 class="study-calendar-month" id="studyCalendarMonthLabel">
                    -
                  </h2>

                  <button
                    type="button"
                    class="study-calendar-nav-btn"
                    id="studyCalendarNextBtn"
                    aria-label="다음 달 보기"
                  >
                    ›
                  </button>
                </div>

                <div
                  class="study-calendar-grid study-calendar-grid--page"
                  id="studyCalendarGrid"
                  aria-label="자기개발 달력"
                ></div>
              </section>

              <aside class="panel study-calendar-todo-panel">
                <div class="study-calendar-selected">
                  <p class="study-calendar-selected__label">선택한 날짜</p>
                  <h2
                    class="study-calendar-selected__date"
                    id="studySelectedDate"
                  >
                    -
                  </h2>
                </div>

                <form class="study-todo-form" id="studyTodoForm">
                  <select
                    class="study-todo-form__select"
                    id="studyTodoType"
                    aria-label="할 일 타입 선택"
                  >
                    <option value="study">공부</option>
                    <option value="workout">운동</option>
                    <option value="etc">기타</option>
                  </select>

                  <button
                    type="button"
                    class="study-todo-form__setting"
                    id="studyCategoryToggle"
                    aria-expanded="false"
                    aria-controls="studyCategoryPanel"
                  >
                    설정
                  </button>

                  <input
                    class="study-todo-form__input"
                    id="studyTodoInput"
                    type="text"
                    placeholder="오늘 할 일을 입력하세요."
                    autocomplete="off"
                  />

                  <button class="study-todo-form__button" type="submit">
                    추가
                  </button>

                  <textarea
                    class="study-todo-form__memo"
                    id="studyTodoMemo"
                    rows="1"
                    placeholder="메모를 입력하세요."
                  ></textarea>
                </form>

                <ul class="study-todo-list" id="studyTodoList"></ul>

                <section
                  class="study-category-manager"
                  aria-labelledby="studyCategoryTitle"
                >
                  <div
                    class="study-category-manager__modal"
                    id="studyCategoryPanel"
                    hidden
                  >
                    <div
                      class="study-category-manager__dialog"
                      role="dialog"
                      aria-modal="true"
                      aria-labelledby="studyCategoryTitle"
                    >
                      <div class="study-category-manager__head">
                        <div>
                          <h3
                            class="study-category-manager__title"
                            id="studyCategoryTitle"
                          >
                            내 카테고리
                          </h3>
                          <p class="study-category-manager__desc">
                            카테고리 이름과 색상을 직접 정할 수 있어.
                          </p>
                        </div>

                        <button
                          type="button"
                          class="study-category-manager__close"
                          id="studyCategoryClose"
                          aria-label="카테고리 관리 닫기"
                        >
                          닫기
                        </button>
                      </div>

                      <form class="study-category-form" id="studyCategoryForm">
                        <input
                          class="study-category-form__input"
                          id="studyCategoryName"
                          type="text"
                          maxlength="20"
                          placeholder="새 카테고리 이름"
                          autocomplete="off"
                        />

                        <input
                          class="study-category-form__color"
                          id="studyCategoryColor"
                          type="color"
                          value="#eaffd7"
                          aria-label="카테고리 색상 선택"
                        />

                        <button
                          class="study-category-form__button"
                          type="submit"
                        >
                          추가
                        </button>
                      </form>

                      <div
                        class="study-category-palette"
                        id="studyCategoryPalette"
                        aria-label="카테고리 색상 프리셋"
                      ></div>

                      <ul
                        class="study-category-list"
                        id="studyCategoryList"
                      ></ul>

                      <p
                        class="study-category-manager__notice"
                        id="studyCategoryNotice"
                      >
                        기본 카테고리는 삭제할 수 없고, 직접 추가한 카테고리만
                        삭제할 수 있어.
                      </p>
                    </div>
                  </div>
                </section>

                <p class="study-todo-empty" id="studyTodoEmpty">
                  아직 등록된 할 일이 없습니다.
                </p>
              </aside>
            </div>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
