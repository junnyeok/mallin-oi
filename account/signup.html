<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | 말린오이닷컴</title>

    <!-- 공통 css -->
    <link rel="shortcut icon" href="../images/favicon.ico" />
    <link rel="stylesheet" href="../assets/css/00-reset.css" />
    <link rel="stylesheet" href="../assets/css/01-tokens.css" />
    <link rel="stylesheet" href="../assets/css/02-base.css" />
    <link rel="stylesheet" href="../assets/css/03-layout.css" />
    <link rel="stylesheet" href="../assets/css/components/forms.css" />
    <link rel="stylesheet" href="../assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="../assets/css/components/nav.css" />
    <link rel="stylesheet" href="../assets/css/components/footer.css" />
    <link rel="stylesheet" href="../assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="../assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="../assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="../assets/css/components/auth-links.css" />

    <!-- page -->
    <link rel="stylesheet" href="../assets/css/pages/index.css" />

    <!-- signup 전용 -->
    <link rel="stylesheet" href="../assets/css/main/signup-main.css" />
  </head>

  <body data-page="signup">
    <div class="page">
      <!-- 헤더 -->
      <div data-include="header"></div>

      <!-- 회원가입 영역 -->
      <main class="signup-main">
        <div class="signup-card">
          <h1 class="signup-title">회원가입</h1>

          <form id="signupForm" class="signup-form" autocomplete="on">
            <div class="signup-field">
              <label for="signupEmail">이메일</label>
              <input
                type="email"
                id="signupEmail"
                name="signupEmail"
                required
                placeholder="example@email.com"
                autocomplete="email"
              />
              <p class="help-text">
                로그인할 때 사용할 이메일이야. 이메일 형식으로 입력해줘.
              </p>
            </div>

            <div class="signup-field">
              <label for="signupNickname">닉네임</label>
              <input
                type="text"
                id="signupNickname"
                name="signupNickname"
                required
                minlength="2"
                maxlength="20"
                placeholder="최소 2글자 이상"
                autocomplete="nickname"
              />
              <p class="help-text">닉네임은 최소 2글자 이상 입력해줘.</p>
            </div>

            <div class="signup-field">
              <label for="signupPw">비밀번호</label>
              <input
                type="password"
                id="signupPw"
                name="signupPw"
                required
                minlength="6"
                maxlength="32"
                placeholder="6자 이상"
                autocomplete="new-password"
              />
              <p class="help-text">최소 6자 이상을 권장해.</p>
            </div>

            <div class="signup-field">
              <label for="signupPw2">비밀번호 확인</label>
              <input
                type="password"
                id="signupPw2"
                name="signupPw2"
                required
                minlength="6"
                maxlength="32"
                placeholder="비밀번호 다시 입력"
                autocomplete="new-password"
              />
            </div>

            <div class="signup-agree">
              <label class="agree-item">
                <input type="checkbox" id="agreeTerms" required />
                <span>이용약관에 동의합니다 (필수)</span>
              </label>
              <label class="agree-item">
                <input type="checkbox" id="agreePrivacy" required />
                <span>개인정보처리방침에 동의합니다 (필수)</span>
              </label>
              <label class="agree-item">
                <input type="checkbox" id="agreeMarketing" />
                <span>마케팅 수신 동의 (선택)</span>
              </label>
            </div>

            <button type="submit" class="signup-btn">가입하기</button>

            <!-- 하단 링크 -->
            <div class="signup-links" aria-label="계정 도움말">
              <a class="auth-link" href="../login.html">로그인</a>
              <span class="signup-links__sep" aria-hidden="true">|</span>
              <a class="auth-link" href="./find-id.html">아이디 찾기</a>
              <span class="signup-links__sep" aria-hidden="true">|</span>
              <a class="auth-link" href="./find-password.html">비밀번호 찾기</a>
            </div>

            <p class="signup-msg" id="signupMsg"></p>
          </form>
        </div>
      </main>

      <!-- 푸터 -->
      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="../images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
