<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아이디 찾기 | 말린오이닷컴</title>

    <!-- 공통 css -->
    <link rel="shortcut icon" href="../images/favicon.ico" />
    <link rel="stylesheet" href="../assets/css/00-reset.css" />
    <link rel="stylesheet" href="../assets/css/01-tokens.css" />
    <link rel="stylesheet" href="../assets/css/02-base.css" />
    <link rel="stylesheet" href="../assets/css/03-layout.css" />
    <link rel="stylesheet" href="../assets/css/components/forms.css" />
    <link rel="stylesheet" href="../assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="../assets/css/components/nav.css" />
    <link rel="stylesheet" href="../assets/css/components/footer.css" />
    <link rel="stylesheet" href="../assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="../assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="../assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="../assets/css/components/auth-links.css" />

    <link rel="stylesheet" href="../assets/css/pages/index.css" />
    <link rel="stylesheet" href="../assets/css/main/account-auth-main.css" />
  </head>

  <body data-page="find-id">
    <div class="page">
      <div data-include="header"></div>

      <main class="account-auth-main">
        <div class="account-auth-card">
          <h1 class="account-auth-title">아이디 찾기</h1>
          <p class="account-auth-desc">
            이름과 생년월일을 먼저 확인한 뒤<br />
            가입할 때 등록한 질문의 답을 입력해줘.
          </p>

          <form id="findIdForm" class="account-auth-form">
            <section id="findIdStep1" class="account-auth-step">
              <div class="account-auth-field">
                <label for="findIdName">이름</label>
                <input
                  type="text"
                  id="findIdName"
                  name="findIdName"
                  placeholder="예: 홍길동"
                  autocomplete="name"
                  required
                />
              </div>

              <div class="account-auth-field">
                <label for="findIdBirthKey">생년월일</label>
                <input
                  type="text"
                  id="findIdBirthKey"
                  name="findIdBirthKey"
                  inputmode="numeric"
                  maxlength="8"
                  placeholder="예: 990101-1"
                  autocomplete="off"
                  required
                />
              </div>

              <button type="submit" class="account-auth-btn" id="findIdNextBtn">
                다음
              </button>
            </section>

            <section id="findIdStep2" class="account-auth-step" hidden>
              <div class="account-auth-result">
                <p class="account-auth-result__label">아이디 힌트</p>
                <p class="account-auth-result__value" id="findIdMaskedEmail">
                  -
                </p>
              </div>

              <div class="account-auth-field">
                <label id="findIdQuestionLabel" for="findIdAnswer">
                  질문
                </label>
                <input
                  type="text"
                  id="findIdAnswer"
                  name="findIdAnswer"
                  placeholder="질문의 답을 입력해줘"
                  autocomplete="off"
                />
              </div>

              <input type="hidden" id="findIdQuestionKey" />

              <div class="account-auth-actions">
                <button
                  type="button"
                  class="account-auth-btn account-auth-btn--sub"
                  id="findIdBackBtn"
                >
                  이전
                </button>
                <button
                  type="submit"
                  class="account-auth-btn"
                  id="findIdVerifyBtn"
                >
                  아이디 확인
                </button>
              </div>
            </section>

            <p class="account-auth-msg" id="findIdMsg"></p>

            <div class="account-auth-links" aria-label="계정 관련 링크">
              <a class="auth-link" href="../login.html">로그인</a>
              <span class="account-auth-links__sep" aria-hidden="true">|</span>
              <a class="auth-link" href="./signup.html">회원가입</a>
              <span class="account-auth-links__sep" aria-hidden="true">|</span>
              <a class="auth-link" href="./find-password.html">비밀번호 찾기</a>
            </div>
          </form>

          <div class="account-auth-note">
            이름과 생년월일이 일치해야 다음 단계로 넘어갈 수 있어.
          </div>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="../images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
