<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>소셜 계정 연결 | 말린오이닷컴</title>
  <link rel="icon" href="../images/favicon.ico" />
  <script src="../assets/js/calendar-appearance.js"></script>
  <link rel="stylesheet" href="../assets/css/00-reset.css" />
  <link rel="stylesheet" href="../assets/css/01-tokens.css" />
  <link rel="stylesheet" href="../assets/css/02-base.css" />
  <link rel="stylesheet" href="../assets/css/components/social-auth.css" />
</head>
<body data-page="social-connections">
  <main class="social-auth-page">
    <a id="socialBack" class="social-auth-link" href="../mypage.html">‹ 계정 관리</a>
    <h1>소셜 계정 연결</h1>
    <p>평소 사용하는 계정을 연결하면 같은 일정과 기록을 이어서 이용할 수 있어요.</p>
    <p id="socialStatus" class="social-auth-message" role="status" aria-live="polite">연결 상태를 확인하고 있어요.</p>
    <div id="socialManagement" hidden>
      <section class="social-auth-card" aria-labelledby="proofTitle">
        <h2 id="proofTitle">본인 확인</h2>
        <p>연결·해제할 때 현재 비밀번호 또는 내 이메일로 받은 인증번호가 필요해요.</p>
        <label>현재 비밀번호<input id="socialPassword" type="password" autocomplete="current-password" /></label>
        <p id="socialEmail" class="social-auth-message"></p>
        <button id="socialSendProof" type="button">이메일 인증번호 받기</button>
        <label>이메일 인증번호<input id="socialOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" /></label>
        <button id="socialEnterAccount" type="button">본인 확인 후 계정 관리</button>
      </section>
      <section class="social-auth-card" aria-labelledby="linksTitle">
        <h2 id="linksTitle">연결된 로그인 방법</h2>
        <div id="socialLinks"></div>
        <p class="social-auth-message">제공자별로 한 계정을 연결할 수 있어요. 마지막 로그인 방법은 해제할 수 없어요.</p>
      </section>
      <section class="social-auth-card" aria-labelledby="passwordTitle">
        <h2 id="passwordTitle">이메일 로그인 비밀번호</h2>
        <p>소셜 계정으로 가입했어도 비밀번호를 설정하면 이메일로 로그인할 수 있어요.</p>
        <label>새 비밀번호<input id="socialNewPassword" type="password" autocomplete="new-password" minlength="10" maxlength="64" /></label>
        <label>새 비밀번호 확인<input id="socialNewPasswordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="64" /></label>
        <button id="socialSavePassword" type="button">본인 확인하고 비밀번호 설정</button>
      </section>
    </div>
    <div class="social-auth-actions"><a id="socialLoginLink" class="social-auth-link" href="../login.html">로그인 화면</a></div>
  </main>
  <script type="module" src="../assets/js/modules/social-auth-page.js"></script>
</body>
</html>
