<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 찾기 | 말린오이닷컴</title>

    <!-- 공통 css -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="../images/favicon.ico" />
    <link rel="manifest" href="../site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <link rel="stylesheet" href="../assets/css/00-reset.css" />
    <link rel="stylesheet" href="../assets/css/01-tokens.css" />
    <link rel="stylesheet" href="../assets/css/02-base.css" />
    <link rel="stylesheet" href="../assets/css/03-layout.css" />
    <link rel="stylesheet" href="../assets/css/components/forms.css" />
    <link rel="stylesheet" href="../assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="../assets/css/components/nav.css" />
    <link rel="stylesheet" href="../assets/css/components/footer.css" />
    <link rel="stylesheet" href="../assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="../assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="../assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="../assets/css/components/auth-links.css" />

    <link rel="stylesheet" href="../assets/css/pages/index.css" />
    <link rel="stylesheet" href="../assets/css/main/account-auth-main.css" />
  </head>

  <body data-page="find-password">
    <div class="page">
      <div data-include="header"></div>

      <main class="account-auth-main">
        <div class="account-auth-card">
          <h1 class="account-auth-title">비밀번호 찾기</h1>
          <p class="account-auth-desc">
            가입한 이메일을 입력하면<br />
            비밀번호 재설정 링크를 메일로 보내줄게.
          </p>

          <form id="findPasswordForm" class="account-auth-form">
            <div class="account-auth-field">
              <label for="findPasswordEmail">이메일(아이디)</label>
              <input
                type="email"
                id="findPasswordEmail"
                name="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
              />
            </div>

            <button type="submit" class="account-auth-btn">
              재설정 링크 보내기
            </button>

            <p class="account-auth-msg" id="findPasswordMsg"></p>

            <div class="account-auth-links" aria-label="계정 관련 링크">
              <a class="auth-link" href="../login.html">로그인</a>
              <span class="account-auth-links__sep" aria-hidden="true">|</span>
              <a class="auth-link" href="./find-id.html">아이디 찾기</a>
              <span class="account-auth-links__sep" aria-hidden="true">|</span>
              <a class="auth-link" href="./signup.html">회원가입</a>
            </div>
          </form>

          <div class="account-auth-note">
            메일이 안 보이면 스팸함도 같이 확인해줘.
          </div>
        </div>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="../images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
