<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>이벤트 캘린더 - 말린오이닷컴</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <script>
      (() => {
        const key = 'mallin:calendar-app-mode';
        const params = new URLSearchParams(window.location.search);
        const hasCalendarQuery = params.get('app') === 'calendar';
        const isNativeCalendarApp =
          window.Capacitor?.isNativePlatform?.() === true;

        try {
          if (hasCalendarQuery) sessionStorage.setItem(key, 'calendar');
        } catch {
          // sessionStorage가 막힌 환경이면 무시
        }

        if (hasCalendarQuery || isNativeCalendarApp) {
          document.documentElement.classList.add('is-calendar-app-mode');
        }
      })();
    </script>

    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />
    <link rel="stylesheet" href="./assets/css/components/update-banner.css" />
    <link
      rel="stylesheet"
      href="./assets/css/components/calendar-app-download-popup.css"
    />

    <link rel="stylesheet" href="./assets/css/main/main.css" />
    <link rel="stylesheet" href="./assets/css/main/calendar-event-main.css" />
    <link
      rel="stylesheet"
      href="./assets/css/components/calendar-entry-sheet.css"
    />
    <link rel="stylesheet" href="./assets/css/main/app-calendar-main.css" />
    <link rel="stylesheet" href="./assets/css/main/calendar-groups-main.css" />
  </head>

  <body class="theme-event" data-page="calendar-event">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section
          class="home-section event-calendar-page"
          id="eventCalendarPage"
        >
          <div class="container">
            <div class="event-calendar-page__head">
              <div>
                <h1 class="event-calendar-page__title">🗓️ 이벤트 캘린더</h1>
                <p class="event-calendar-page__desc">
                  개인 일정, 약속, 행사, 할 일을 날짜별로 기록해보세요.
                  <br />계정별로 기록 되므로 다른 사람은 볼 수 없으니
                  걱정마세요!
                </p>
              </div>
              <button
                type="button"
                class="calendar-add-button"
                id="eventEntrySheetOpen"
                aria-label="이벤트 일정 추가"
              >
                +
              </button>
            </div>

            <div class="event-calendar-layout">
              <section
                class="panel event-calendar-main-panel"
                aria-labelledby="eventCalendarMonthLabel"
              >
                <div class="event-calendar-toolbar">
                  <button
                    type="button"
                    class="event-calendar-nav-btn"
                    id="eventCalendarPrevBtn"
                    aria-label="이전 달 보기"
                  >
                    ‹
                  </button>

                  <h2 class="event-calendar-month" id="eventCalendarMonthLabel">
                    -
                  </h2>

                  <button
                    type="button"
                    class="event-calendar-nav-btn"
                    id="eventCalendarNextBtn"
                    aria-label="다음 달 보기"
                  >
                    ›
                  </button>
                </div>

                <div
                  class="event-calendar-grid event-calendar-grid--page"
                  id="eventCalendarGrid"
                  aria-label="이벤트 달력"
                ></div>
              </section>

              <aside class="panel event-calendar-todo-panel">
                <div class="event-calendar-selected">
                  <p class="event-calendar-selected__label">선택한 날짜</p>
                  <h2
                    class="event-calendar-selected__date"
                    id="eventSelectedDate"
                  >
                    -
                  </h2>
                </div>

                <form class="event-todo-form" id="eventTodoForm">
                  <div class="event-todo-form__actions">
                    <div class="event-todo-form__action-row">
                      <select
                        class="event-todo-form__select"
                        id="eventTodoType"
                        aria-label="일정 카테고리 선택"
                      >
                        <option value="appointment">약속</option>
                        <option value="schedule">일정</option>
                        <option value="anniversary">기념일</option>
                      </select>

                      <button
                        type="button"
                        class="event-todo-form__setting"
                        id="eventCategoryToggle"
                        aria-expanded="false"
                        aria-controls="eventCategoryPanel"
                      >
                        설정
                      </button>
                    </div>

                    <div class="event-todo-form__action-row">
                      <button
                        type="button"
                        class="event-todo-form__date-toggle"
                        id="eventDateToggle"
                        aria-expanded="false"
                        aria-controls="eventDatePanel"
                      >
                        날짜 선택
                      </button>

                      <button class="event-todo-form__button" type="submit">
                        추가
                      </button>
                    </div>
                  </div>

                  <div
                    class="event-date-picker"
                    id="eventDatePanel"
                    role="dialog"
                    aria-label="일정 날짜 범위 선택"
                    aria-hidden="true"
                    hidden
                  >
                    <div class="event-date-picker__head">
                      <strong class="event-date-picker__title">날짜 선택</strong>
                      <button
                        type="button"
                        class="event-date-picker__close"
                        id="eventDateClose"
                        aria-label="날짜 선택 닫기"
                      >
                        닫기
                      </button>
                    </div>

                    <div class="event-date-picker__fields">
                      <label class="event-date-picker__field">
                        <span class="event-date-picker__label">시작 날짜</span>
                        <input
                          class="event-date-picker__input"
                          id="eventStartDate"
                          type="date"
                          required
                        />
                      </label>

                      <label class="event-date-picker__field">
                        <span class="event-date-picker__label">종료 날짜</span>
                        <input
                          class="event-date-picker__input"
                          id="eventEndDate"
                          type="date"
                        />
                      </label>
                    </div>
                  </div>

                  <div class="event-todo-form__times">
                    <input
                      class="event-todo-form__time"
                      id="eventTodoTime"
                      type="text"
                      readonly
                      inputmode="none"
                      placeholder="00:00"
                      aria-label="일정 시작 선택"
                    />

                    <input
                      class="event-todo-form__time"
                      id="eventTodoEndTime"
                      type="text"
                      readonly
                      inputmode="none"
                      placeholder="00:00"
                      aria-label="일정 종료 선택"
                    />
                  </div>

                  <input
                    class="event-todo-form__input"
                    id="eventTodoInput"
                    type="text"
                    placeholder="일정 제목을 입력하세요."
                    autocomplete="off"
                  />

                  <textarea
                    class="event-todo-form__memo"
                    id="eventTodoMemo"
                    rows="1"
                    placeholder="메모를 입력하세요."
                  ></textarea>
                </form>

                <ul class="event-todo-list" id="eventTodoList"></ul>

                <section
                  class="event-category-manager"
                  aria-labelledby="eventCategoryTitle"
                >
                  <div
                    class="event-category-manager__modal"
                    id="eventCategoryPanel"
                    hidden
                  >
                    <div
                      class="event-category-manager__dialog"
                      role="dialog"
                      aria-modal="true"
                      aria-labelledby="eventCategoryTitle"
                    >
                      <div class="event-category-manager__head">
                        <div>
                          <h3
                            class="event-category-manager__title"
                            id="eventCategoryTitle"
                          >
                            내 카테고리
                          </h3>
                          <p class="event-category-manager__desc">
                            카테고리 이름과 색상을 직접 정할 수 있어.
                          </p>
                        </div>

                        <button
                          type="button"
                          class="event-category-manager__close"
                          id="eventCategoryClose"
                          aria-label="카테고리 관리 닫기"
                        >
                          닫기
                        </button>
                      </div>

                      <form class="event-category-form" id="eventCategoryForm">
                        <input
                          class="event-category-form__input"
                          id="eventCategoryName"
                          type="text"
                          maxlength="20"
                          placeholder="새 카테고리 이름"
                          autocomplete="off"
                        />

                        <input
                          class="event-category-form__color"
                          id="eventCategoryColor"
                          type="color"
                          value="#eaffd7"
                          aria-label="카테고리 색상 선택"
                        />

                        <button
                          class="event-category-form__button"
                          type="submit"
                        >
                          추가
                        </button>
                      </form>

                      <div
                        class="event-category-palette"
                        id="eventCategoryPalette"
                        aria-label="카테고리 색상 프리셋"
                      ></div>

                      <ul
                        class="event-category-list"
                        id="eventCategoryList"
                      ></ul>

                      <p
                        class="event-category-manager__notice"
                        id="eventCategoryNotice"
                      >
                        기본 카테고리는 삭제할 수 없고, 직접 추가한 카테고리만
                        삭제할 수 있어.
                      </p>
                    </div>
                  </div>
                </section>

                <p class="event-todo-empty" id="eventTodoEmpty">
                  아직 등록된 일정이 없습니다.
                </p>
              </aside>
            </div>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
