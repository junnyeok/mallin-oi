    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말린오이닷컴" />
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />

  <body class="theme-study" data-page="study">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section class="home-section">
          <div class="container">
            <section
              class="panel panel--latest-wide study-calendar-preview"
              aria-labelledby="studyCalendarPreviewTitle"
            >
              <a
                class="study-calendar-preview__link"
                href="./calendar-study.html"
                id="studyCalendarPreviewLink"
                aria-label="자기개발 캘린더 상세 페이지로 이동"
              >
                <div class="panel__head study-calendar-preview__head">
                  <div>
                    <h2 class="panel__title" id="studyCalendarPreviewTitle">
                      🗓️ 이번달 자기개발 캘린더
                    </h2>
                    <p class="panel__desc">
                      공부, 운동, 자기관리 할 일을 날짜별로 기록해봐!
                    </p>
                  </div>
                  <span class="study-calendar-preview__more"
                    >자세히 보기 →</span
                  >
                </div>

                <div class="study-calendar-mini" id="studyCalendarPreview">
                  <div class="study-calendar-mini__empty">
                    이번달 캘린더를 불러오는 중입니다.
                  </div>
                </div>
              </a>
            </section>

            <div class="panel panel--latest-wide" id="latestUploadSection">
              <div class="panel__head panel__head--with-more">
                <h2 class="panel__title">🆕 최신 업로드</h2>
                <a
                  class="home-section__more home-section__more--cta home-section__more--panel"
                  href="./posts-all.html"
                  >더보기</a
                >
              </div>
              <div class="mini" id="latestList"></div>
            </div>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />

    <script type="module" src="./assets/js/boot.js"></script>
  </body>
</html>
