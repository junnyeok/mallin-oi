<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>새 글 쓰기 | 말린오이닷컴</title>

    <link rel="shortcut icon" href="./images/favicon.ico" />

    <!-- 공통 -->
    <link rel="stylesheet" href="./assets/css/00-reset.css" />
    <link rel="stylesheet" href="./assets/css/01-tokens.css" />
    <link rel="stylesheet" href="./assets/css/02-base.css" />
    <link rel="stylesheet" href="./assets/css/03-layout.css" />
    <link rel="stylesheet" href="./assets/css/components/buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/forms.css" />
    <link rel="stylesheet" href="./assets/css/components/cursor-buddy.css" />
    <link rel="stylesheet" href="./assets/css/components/nav.css" />
    <link rel="stylesheet" href="./assets/css/components/footer.css" />
    <link rel="stylesheet" href="./assets/css/components/write-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/search-btn.css" />
    <link rel="stylesheet" href="./assets/css/components/scroll-buttons.css" />
    <link rel="stylesheet" href="./assets/css/components/auth-links.css" />

    <!-- 페이지 -->
    <link rel="stylesheet" href="./assets/css/pages/index.css" />

    <!-- write page main -->
    <link rel="stylesheet" href="./assets/css/main/write-main.css" />
  </head>

  <body class="theme-home" data-page="write">
    <div class="page">
      <div data-include="header"></div>

      <main class="site-main">
        <section class="write">
          <div class="container">
            <header class="write__head">
              <h1 class="write__title">새 글 쓰기</h1>
              <p class="write__desc">
                이제 글은 수파베이스 DB에 바로 저장돼. 등록하면 자동으로
                전체보기와 상세 페이지에 반영돼.
              </p>
            </header>

            <div class="write__grid" style="grid-template-columns: 1fr">
              <section class="write-card" aria-label="새 글 입력">
                <form class="write-form" id="writeForm">
                  <div class="write-row">
                    <label class="write-label" for="title">제목 *</label>
                    <input
                      class="write-control"
                      id="title"
                      type="text"
                      placeholder="제목을 입력"
                    />
                  </div>

                  <div class="write-row">
                    <label class="write-label" for="excerpt"
                      >요약(Excerpt) *</label
                    >
                    <textarea
                      class="write-control write-control--area"
                      id="excerpt"
                      rows="3"
                      placeholder="목록에 보일 짧은 요약"
                    ></textarea>
                  </div>

                  <div class="write-row">
                    <label class="write-label" for="body">글내용(본문) *</label>
                    <textarea
                      class="write-control write-control--area write-control--body"
                      id="body"
                      rows="12"
                      placeholder="여기에 본문을 입력해. 현재는 보안상 텍스트 기준으로 저장돼."
                    ></textarea>
                    <p class="write-help">줄바꿈과 문단은 자동으로 처리돼.</p>
                  </div>

                  <div class="write-row">
                    <label class="write-label" for="category">카테고리</label>
                    <select class="write-control" id="category">
                      <option value="study">study (공부)</option>
                      <option value="work">work (업무)</option>
                      <option value="event">event (이벤트)</option>
                      <option value="career">career (이력)</option>
                    </select>
                  </div>

                  <div class="write-row">
                    <label class="write-label" for="tags"
                      >태그(쉼표로 구분)</label
                    >
                    <input
                      class="write-control"
                      id="tags"
                      type="text"
                      placeholder="예: 코딩, css, layout"
                    />
                    <p class="write-help">
                      #은 붙여도 자동으로 제거돼. 중복 태그는 알아서 정리함.
                    </p>
                  </div>

                  <div class="write-row">
                    <label class="write-check">
                      <input id="pinned" type="checkbox" />
                      고정글(pinned)
                    </label>
                  </div>

                  <div class="write-actions">
                    <button
                      class="write-action"
                      id="writeSubmitBtn"
                      type="submit"
                    >
                      등록
                    </button>
                  </div>

                  <p class="write-note" id="writeNote" aria-live="polite"></p>
                </form>
              </section>
            </div>
          </div>
        </section>
      </main>

      <div data-include="footer"></div>
    </div>

    <img
      id="cukeBuddy"
      src="./images/logo-home.png"
      alt="말린오이"
      class="cursor-buddy"
    />
    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
